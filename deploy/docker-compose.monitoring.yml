# Optional monitoring stack for KasaMonitor: Prometheus (10 years retention) + Grafana with the KasaMonitor
# dashboard and two alert rules pre-provisioned.
#
#   docker compose -f deploy/docker-compose.monitoring.yml up -d
#
# Grafana: http://<host>:3000 (admin / $GRAFANA_ADMIN_PASSWORD, default "admin" - change it).
# Prometheus: http://<host>:9090 (Status -> Targets: job "kasa" must be UP).
# KasaMonitor itself is started with deploy/docker-compose.yml (it needs host networking, these two do not).
# Relative paths below are resolved from this file's directory (deploy/).

services:
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.5.0}
    container_name: kasamonitor-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=10y
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      # Lets the container reach KasaMonitor on the host (network_mode: host) as host.docker.internal on Linux.
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-12.0.0}
    container_name: kasamonitor-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  prometheus_data:
  grafana_data:
