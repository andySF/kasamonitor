services:
  kasamonitor:
    image: duobit/kasamonitor:latest
    container_name: kasamonitor
    network_mode: host          # REQUIRED for UDP broadcast discovery on the LAN
    restart: unless-stopped
    volumes:
      - /share/Container/kasamonitor/data:/data
    environment:
      TZ: Europe/Bucharest
      KasaMonitor__BroadcastNetworks: "192.168.254.255"
      KasaMonitor__TariffRonPerKwh: "1.30"
      KasaMonitor__PollIntervalSeconds: "10"
      # Initial values only; whatever is saved in /settings (database) wins. See README.md.
      # KasaMonitor__TapoUsername: "<email cont TP-Link>"
      # KasaMonitor__TapoPassword: "<parola cont TP-Link>"
